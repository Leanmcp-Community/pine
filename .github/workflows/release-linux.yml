name: Release Linux binaries

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable --no-self-update
      - name: Verify release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          export VERSION=$(cargo +stable metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$TAG" = "v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Run tests
        run: cargo +stable test --locked
      - name: Build release
        run: cargo +stable build --release --locked
      - name: Package and checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          target/release/pine --version
          target/release/pine --help
          mkdir dist
          python3 -c 'import json,os; print(json.dumps({"version": os.environ["VERSION"], "target": os.environ["TARGET"]}))' > target/release/release.json
          tar -czf "dist/pine-$TARGET.tar.gz" -C target/release pine release.json
          cd dist
          sha256sum "pine-$TARGET.tar.gz" > "pine-$TARGET.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
