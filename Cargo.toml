[package]
name = "pine"
version = "0.2.0"
edition = "2021"
description = "Local HTTPS MITM proxy that taps Claude Code traffic into ~/.pine"
license = "MIT"
build = "build.rs"

[[bin]]
name = "pine"
path = "src/main.rs"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# HTTP / hyper stack
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = [
    "client",
    "client-legacy",
    "http1",
    "http2",
    "server",
    "server-auto",
    "service",
    "tokio",
] }
http = "1"
http-body-util = "0.1"
bytes = "1"

# TLS (both legs are pure-rustls)
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }

# CLI / serialization / utilities
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ulid = "1"
time = { version = "0.3", features = ["formatting", "serde-well-known", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "1"
futures-util = "0.3"
reqwest = { version = "0.13.3", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
